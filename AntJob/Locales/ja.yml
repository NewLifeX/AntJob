# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "処理を停止します: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "{0} 個のタスクがまだ実行中です (ハングしている可能性があります)。待機を断念します。"
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "タスク [{0}] が最大非アクティブ時間 {1} 秒を超えました。ジョブをハングとしてマークします。"
"C# scripting is not supported on net45; use net461 or later.": "net45 では C# スクリプトはサポートされていません。net461 以降を使用してください。"
"Message scheduling requires a topic.": "メッセージ スケジューリングにはトピックが必要です。"
"No handler is available.": "利用可能なハンドラーがありません。"
"Connecting to the scheduling center: {0}": "スケジューリング センターに接続しています: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "[{0}] の [{1}] の状態レポートに失敗しました: {2}"
"Debug switch. Defaults to false.": "デバッグスイッチ。既定値は false。"
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "スケジューリングセンター。カンマ区切りの複数アドレス、主系/待機系構成。"
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "アプリケーション識別子。スケジューリングセンターがアプリケーションを分離するために使用し、既定は現在のアプリケーション。"
"Application secret.": "アプリケーションシークレット。"
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "サービスアドレスの解決に Stardust レジストリを使用するかどうか。既定は true。クライアントがゲートウェイ経由で直接接続する場合は無効化を推奨。"
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "メッセージ型ジョブのアイドル申請周期（秒）。HTTP チャネルは通知を受信すると即座にリセットし、既定は 15 秒。"
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "ジョブ[{0}]はスケジューリングセンターに登録されていないため、今回は起動しません。"
"Job [{0}] is disabled; enable it in the console before it can run.": "ジョブ[{0}]は無効です。実行するにはコンソールで有効にしてください。"
