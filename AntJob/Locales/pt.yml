# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Interrompendo o trabalho: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "Ainda há {0} tarefas em execução (possivelmente travadas); desistindo de esperar."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "A tarefa [{0}] excedeu o tempo máximo de inatividade de {1}s; marcando o trabalho como travado."
"C# scripting is not supported on net45; use net461 or later.": "A criação de scripts em C# não é suportada no net45; use net461 ou posterior."
"Message scheduling requires a topic.": "O agendamento de mensagens requer um tópico."
"No handler is available.": "Nenhum manipulador está disponível."
"Connecting to the scheduling center: {0}": "Conectando ao centro de agendamento: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "Falha no relatório de status de [{1}] de [{0}]: {2}"
"Debug switch. Defaults to false.": "Interruptor de depuração. Padrão false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "Central de agendamento. Vários endereços separados por vírgula, arquitetura primária/secundária."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "Identificador da aplicação. A central de agendamento o usa para isolar aplicações; o padrão é a aplicação atual."
"Application secret.": "Segredo da aplicação."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Se deve usar o registro Stardust para resolver endereços de serviço. Padrão true; recomenda-se desativar quando o cliente se conecta diretamente pelo gateway."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "Período de solicitação ociosa para tarefas do tipo mensagem (segundos). O canal HTTP o redefine imediatamente ao receber uma notificação; padrão 15 segundos."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "A tarefa [{0}] não está registrada no centro de agendamento; ela não será iniciada desta vez."
"Job [{0}] is disabled; enable it in the console before it can run.": "A tarefa [{0}] está desativada; ative-a no console antes que possa ser executada."
