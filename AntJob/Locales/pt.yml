# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Interrompendo o trabalho: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "Ainda há {0} tarefas em execução (possivelmente travadas); desistindo de esperar."
