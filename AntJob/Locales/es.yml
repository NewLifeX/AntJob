# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Deteniendo el trabajo: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "Todavía se están ejecutando {0} tareas (posiblemente bloqueadas); se abandona la espera."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "La tarea [{0}] superó el tiempo máximo de inactividad de {1}s; se marca el trabajo como bloqueado."
"C# scripting is not supported on net45; use net461 or later.": "La creación de scripts de C# no se admite en net45; use net461 o posterior."
"Message scheduling requires a topic.": "La programación de mensajes requiere un tema."
"No handler is available.": "No hay ningún controlador disponible."
"Connecting to the scheduling center: {0}": "Conectando al centro de programación: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "Error al informar del estado de [{1}] de [{0}]: {2}"
"Debug switch. Defaults to false.": "Interruptor de depuración. Valor predeterminado false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "Centro de programación. Varias direcciones separadas por comas, arquitectura principal/secundaria."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "Identificador de aplicación. El centro de programación lo usa para aislar aplicaciones; por defecto, la aplicación actual."
"Application secret.": "Clave de la aplicación."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Si se usa el registro de Stardust para resolver direcciones de servicio. Predeterminado true; se recomienda desactivarlo cuando el cliente se conecta directamente a través de la puerta de enlace."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "Período de solicitud en reposo para trabajos de tipo mensaje (segundos). El canal HTTP lo restablece inmediatamente al recibir una notificación; predeterminado 15 segundos."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "El trabajo [{0}] no está registrado en el centro de programación; no se iniciará esta vez."
"Job [{0}] is disabled; enable it in the console before it can run.": "El trabajo [{0}] está deshabilitado; actívelo en la consola antes de que pueda ejecutarse."
