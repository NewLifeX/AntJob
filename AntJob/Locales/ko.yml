# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "작업 중지: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "{0}개의 작업이 아직 실행 중입니다(중단되었을 수 있음). 대기를 포기합니다."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "작업 [{0}]이(가) 최대 비활성 시간 {1}초를 초과했습니다. 해당 작업을 중단됨으로 표시합니다."
"C# scripting is not supported on net45; use net461 or later.": "net45에서는 C# 스크립팅이 지원되지 않습니다. net461 이상을 사용하세요."
"Message scheduling requires a topic.": "메시지 스케줄링에는 토픽이 필요합니다."
"No handler is available.": "사용 가능한 처리기가 없습니다."
"Connecting to the scheduling center: {0}": "스케줄링 센터에 연결하는 중: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "[{0}]의 [{1}]에 대한 상태 보고에 실패했습니다: {2}"
"Debug switch. Defaults to false.": "디버그 스위치. 기본값 false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "스케줄링 센터. 쉼표로 구분된 여러 주소, 주/보조 아키텍처."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "애플리케이션 식별자. 스케줄링 센터가 이를 사용해 애플리케이션을 격리하며, 기본값은 현재 애플리케이션."
"Application secret.": "애플리케이션 비밀 키."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Stardust 레지스트리를 사용해 서비스 주소를 확인할지 여부. 기본값 true. 클라이언트가 게이트웨이를 통해 직접 연결할 때는 비활성화를 권장."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "메시지형 작업의 유휴 신청 주기(초). HTTP 채널은 알림을 받으면 즉시 재설정하며, 기본값 15초."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "작업 [{0}]이(가) 스케줄링 센터에 등록되지 않아 이번에는 시작하지 않습니다."
"Job [{0}] is disabled; enable it in the console before it can run.": "작업 [{0}]이(가) 비활성화되어 있습니다. 실행하려면 콘솔에서 활성화하세요."
