# 繁體中文譯文。鍵為英文源文，缺失時執行期回退英文。
"Stop working: {0}": "停止工作 {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "仍有{0}個任務未結束（可能僵死），放棄等待"
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "檢測到任務[{0}]超過最大不活躍時間{1}s，標記作業僵死"
"C# scripting is not supported on net45; use net461 or later.": "net45 不支持C#腳本執行，請使用 net461 及以上版本"
"Message scheduling requires a topic.": "消息調度要求設置主題"
"No handler is available.": "沒有可用處理器"
"Connecting to the scheduling center: {0}": "正在連接調度中心：{0}"
"Status report failed for [{1}] of [{0}]: {2}": "[{0}]的[{1}]狀態報告失敗！{2}"
"Debug switch. Defaults to false.": "除錯開關。預設 false"
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "排程中心。以逗號分隔多個位址，主備架構"
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "應用程式識別。排程中心以此隔離應用程式，預設為目前應用程式"
"Application secret.": "應用程式金鑰。"
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "是否使用星塵註冊中心解析服務位址。預設 true；用戶端經閘道直連時建議關閉"
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "訊息型作業閒置申請週期（秒）。HTTP 通道收到通知會立即重設，預設 15 秒"
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "作業[{0}]未在調度中心註冊，本次不啟動"
"Job [{0}] is disabled; enable it in the console before it can run.": "作業[{0}]未啟用，請到控制台啟用後才會執行"
