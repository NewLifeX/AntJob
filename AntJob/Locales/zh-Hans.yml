# 简体中文译文。键为英文源文，缺失时运行期回退英文。
"Stop working: {0}": "停止工作 {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "仍有{0}个任务未结束（可能僵死），放弃等待"
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "检测到任务[{0}]超过最大不活跃时间{1}s，标记作业僵死"
"C# scripting is not supported on net45; use net461 or later.": "net45 不支持C#脚本执行，请使用 net461 及以上版本"
"Message scheduling requires a topic.": "消息调度要求设置主题"
"No handler is available.": "没有可用处理器"
"Connecting to the scheduling center: {0}": "正在连接调度中心：{0}"
"Status report failed for [{1}] of [{0}]: {2}": "[{0}]的[{1}]状态报告失败！{2}"
"Debug switch. Defaults to false.": "调试开关。默认false"
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "调度中心。逗号分隔多地址，主备架构"
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "应用标识。调度中心以此隔离应用，默认当前应用"
"Application secret.": "应用密钥。"
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "是否使用星尘注册中心解析服务地址。默认true；客户端经网关直连时建议关闭"
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "消息型作业空闲申请周期（秒）。HTTP 通道收到通知会立即复位，默认15秒"
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "作业[{0}]未在调度中心注册，本次不启动"
"Job [{0}] is disabled; enable it in the console before it can run.": "作业[{0}]未启用，请到控制台启用后才会执行"
