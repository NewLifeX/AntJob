# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Arbeit wird beendet: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "{0} Aufgaben werden noch ausgeführt (möglicherweise hängen sie); Warten wird aufgegeben."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "Aufgabe [{0}] hat die maximale Inaktivitätszeit von {1}s überschritten; die Aufgabe wird als hängend markiert."
"C# scripting is not supported on net45; use net461 or later.": "C#-Skripterstellung wird unter net45 nicht unterstützt; verwenden Sie net461 oder höher."
"Message scheduling requires a topic.": "Die Nachrichtenplanung erfordert ein Thema."
"No handler is available.": "Es ist kein Handler verfügbar."
"Connecting to the scheduling center: {0}": "Verbindung zum Planungszentrum: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "Statusbericht für [{1}] von [{0}] fehlgeschlagen: {2}"
"Debug switch. Defaults to false.": "Debug-Schalter. Standardwert false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "Planungszentrale. Mehrere durch Kommas getrennte Adressen, Primär-/Sekundärarchitektur."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "Anwendungskennung. Die Planungszentrale isoliert damit Anwendungen, Standard ist die aktuelle Anwendung."
"Application secret.": "Anwendungsschlüssel."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Ob der Stardust-Registrierungsdienst zur Auflösung der Dienstadressen verwendet wird. Standardwert true; bei direkter Client-Verbindung über das Gateway wird Deaktivierung empfohlen."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "Leerlauf-Anfrageintervall für Jobs vom Nachrichtentyp (Sekunden). Der HTTP-Kanal setzt es beim Empfang einer Benachrichtigung sofort zurück, Standard 15 Sekunden."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "Auftrag [{0}] ist im Planungszentrum nicht registriert und wird diesmal nicht gestartet."
"Job [{0}] is disabled; enable it in the console before it can run.": "Auftrag [{0}] ist deaktiviert; aktivieren Sie ihn in der Konsole, bevor er ausgeführt werden kann."
