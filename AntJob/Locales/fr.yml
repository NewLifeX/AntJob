# Français 词表（fr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Arrêt du travail : {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "{0} tâches sont encore en cours d'exécution (peut-être bloquées) ; abandon de l'attente."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "La tâche [{0}] a dépassé le temps d'inactivité maximal de {1}s ; la tâche est marquée comme bloquée."
"C# scripting is not supported on net45; use net461 or later.": "Les scripts C# ne sont pas pris en charge sous net45 ; utilisez net461 ou ultérieur."
"Message scheduling requires a topic.": "La planification des messages nécessite un sujet."
"No handler is available.": "Aucun gestionnaire n'est disponible."
"Connecting to the scheduling center: {0}": "Connexion au centre de planification : {0}"
"Status report failed for [{1}] of [{0}]: {2}": "Échec du rapport d'état pour [{1}] de [{0}] : {2}"
"Debug switch. Defaults to false.": "Commutateur de débogage. Valeur par défaut false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "Centre de planification. Plusieurs adresses séparées par des virgules, architecture primaire/secondaire."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "Identifiant d'application. Le centre de planification l'utilise pour isoler les applications ; par défaut, l'application actuelle."
"Application secret.": "Clé d'application."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Indique s'il faut utiliser le registre Stardust pour résoudre les adresses de service. Valeur par défaut true ; il est recommandé de le désactiver lorsque le client se connecte directement via la passerelle."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "Période de demande au repos pour les tâches de type message (secondes). Le canal HTTP la réinitialise immédiatement à la réception d'une notification ; valeur par défaut 15 secondes."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "La tâche [{0}] n'est pas enregistrée dans le centre de planification ; elle ne démarrera pas cette fois."
"Job [{0}] is disabled; enable it in the console before it can run.": "La tâche [{0}] est désactivée ; activez-la dans la console avant qu'elle puisse s'exécuter."
