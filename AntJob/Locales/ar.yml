# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "إيقاف العمل: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "لا تزال {0} مهام قيد التشغيل (ربما معلّقة)؛ التخلي عن الانتظار."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "تجاوزت المهمة [{0}] الحد الأقصى لعدم النشاط {1} ثانية؛ يتم تعليم المهمة كمعلّقة."
"C# scripting is not supported on net45; use net461 or later.": "برمجة C# غير مدعومة على net45؛ استخدم net461 أو أحدث."
"Message scheduling requires a topic.": "يتطلب جدولة الرسائل موضوعًا."
"No handler is available.": "لا يوجد معالج متاح."
"Connecting to the scheduling center: {0}": "جارٍ الاتصال بمركز الجدولة: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "فشل تقرير الحالة لـ [{1}] من [{0}]: {2}"
"Debug switch. Defaults to false.": "مفتاح التصحيح. الافتراضي false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "مركز الجدولة. عناوين متعددة مفصولة بفواصل، بنية رئيسية/احتياطية."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "معرّف التطبيق. يستخدمه مركز الجدولة لعزل التطبيقات، والافتراضي هو التطبيق الحالي."
"Application secret.": "مفتاح التطبيق."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "هل يتم استخدام مركز تسجيل Stardust لتحليل عناوين الخدمة. الافتراضي true؛ يُنصح بالتعطيل عند اتصال العميل المباشر عبر البوابة."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "دورة طلب الخمول للمهام من نوع الرسائل (ثانية). تعيد قناة HTTP تعيينها فورًا عند تلقي إشعار، الافتراضي 15 ثانية."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "المهمة [{0}] غير مسجلة في مركز الجدولة؛ لن تبدأ هذه المرة."
"Job [{0}] is disabled; enable it in the console before it can run.": "المهمة [{0}] معطلة؛ فعّلها في وحدة التحكم قبل أن تتمكن من العمل."
