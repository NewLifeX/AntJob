# Русский 词表（ru）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Stop working: {0}": "Остановка работы: {0}"
"{0} tasks are still running (possibly hung); giving up waiting.": "Всё ещё выполняется задач: {0} (возможно, зависли); ожидание прекращено."
"Task [{0}] exceeded the maximum inactive time of {1}s; marking the job as hung.": "Задача [{0}] превысила максимальное время бездействия {1} с; задача помечается как зависшая."
"C# scripting is not supported on net45; use net461 or later.": "Скрипты C# не поддерживаются в net45; используйте net461 или новее."
"Message scheduling requires a topic.": "Для планирования сообщений требуется тема."
"No handler is available.": "Нет доступного обработчика."
"Connecting to the scheduling center: {0}": "Подключение к центру планирования: {0}"
"Status report failed for [{1}] of [{0}]: {2}": "Не удалось отправить отчёт о состоянии для [{1}] из [{0}]: {2}"
"Debug switch. Defaults to false.": "Переключатель отладки. По умолчанию false."
"Scheduling center. Multiple addresses separated by commas, primary/secondary architecture.": "Центр планирования. Несколько адресов через запятую, архитектура основной/резервный."
"Application identifier. The scheduling center uses it to isolate applications, defaults to the current application.": "Идентификатор приложения. Центр планирования использует его для изоляции приложений, по умолчанию текущее приложение."
"Application secret.": "Секрет приложения."
"Whether to use the Stardust registry to resolve service addresses. Defaults to true; recommended to disable when the client connects directly through the gateway.": "Использовать ли реестр Stardust для разрешения адресов служб. По умолчанию true; при прямом подключении клиента через шлюз рекомендуется отключить."
"Idle request interval for message-type jobs (seconds). The HTTP channel resets it immediately upon receiving a notification, defaults to 15 seconds.": "Период запроса простоя для заданий типа сообщений (секунды). HTTP-канал немедленно сбрасывает его при получении уведомления, по умолчанию 15 секунд."
"Job [{0}] is not registered in the scheduling center; it will not start this time.": "Задание [{0}] не зарегистрировано в центре планирования; на этот раз оно не будет запущено."
"Job [{0}] is disabled; enable it in the console before it can run.": "Задание [{0}] отключено; включите его в консоли, прежде чем оно сможет выполняться."
