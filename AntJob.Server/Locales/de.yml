# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Job [{0}/{1}] has no data time set.": "Für den Auftrag [{0}/{1}] ist keine Datenzeit festgelegt."
"The application is not enabled.": "Die Anwendung ist nicht aktiviert."
"Debug switch. Defaults to true.": "Debug-Schalter. Standardwert true."
"Port": "Port"
"Token secret. Algorithm and key used to generate JWT tokens, e.g. HS256:ABCD1234.": "Token-Geheimnis. Algorithmus und Schlüssel zur Erzeugung von JWT-Tokens, z. B. HS256:ABCD1234."
"Token validity period. Defaults to 2*3600 seconds.": "Gültigkeitsdauer des Tokens. Standard 2*3600 Sekunden."
"Session timeout. Defaults to 600 seconds.": "Sitzungs-Timeout. Standard 600 Sekunden."
"Auto registration. Registers automatically when any application logs in, saving the trouble of manually configuring application accounts, defaults to true.": "Automatische Registrierung. Registriert sich automatisch bei der Anmeldung einer beliebigen Anwendung und erspart die manuelle Konfiguration von Anwendungskonten, Standard true."
