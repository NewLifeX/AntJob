# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Job [{0}/{1}] has no data time set.": "ジョブ [{0}/{1}] にデータ時刻が設定されていません。"
"The application is not enabled.": "アプリケーションが有効になっていません。"
"Debug switch. Defaults to true.": "デバッグスイッチ。既定値は true。"
"Port": "ポート"
"Token secret. Algorithm and key used to generate JWT tokens, e.g. HS256:ABCD1234.": "トークンシークレット。JWT トークンを生成するためのアルゴリズムとキー（例：HS256:ABCD1234）。"
"Token validity period. Defaults to 2*3600 seconds.": "トークン有効期限。既定は 2*3600 秒。"
"Session timeout. Defaults to 600 seconds.": "セッションタイムアウト。既定は 600 秒。"
"Auto registration. Registers automatically when any application logs in, saving the trouble of manually configuring application accounts, defaults to true.": "自動登録。任意のアプリケーションのログイン時に自動登録し、アプリケーションアカウントの手動設定の手間を省く。既定は true。"
