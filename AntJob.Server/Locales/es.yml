# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Job [{0}/{1}] has no data time set.": "El trabajo [{0}/{1}] no tiene establecida una hora de datos."
"The application is not enabled.": "La aplicación no está habilitada."
"Debug switch. Defaults to true.": "Interruptor de depuración. Valor predeterminado true."
"Port": "Puerto"
"Token secret. Algorithm and key used to generate JWT tokens, e.g. HS256:ABCD1234.": "Secreto del token. Algoritmo y clave usados para generar tokens JWT, p. ej., HS256:ABCD1234."
"Token validity period. Defaults to 2*3600 seconds.": "Período de validez del token. Predeterminado 2*3600 segundos."
"Session timeout. Defaults to 600 seconds.": "Tiempo de espera de sesión. Predeterminado 600 segundos."
"Auto registration. Registers automatically when any application logs in, saving the trouble of manually configuring application accounts, defaults to true.": "Registro automático. Se registra automáticamente cuando cualquier aplicación inicia sesión, evitando configurar manualmente las cuentas de aplicación; predeterminado true."
