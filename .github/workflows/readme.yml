name: readme

on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-*.json'
      - 'readme-*.ps1'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-*.json'
      - 'readme-*.ps1'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-switcher:
    name: check readme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./sync-readme-languages.ps1 -Check
    - name: Check README structure
      shell: pwsh
      run: pwsh -NoProfile -File ./check-readme-structure.ps1
    - name: Check README package copy
      shell: pwsh
      run: pwsh -NoProfile -File ./sync-readme-package.ps1 -Check
